type: container
props:
  position: form-top
  layout: vertical
  center_x: true
  gap: 8
children:
  - type: h1
    props:
      text: Login
      style:
        text-align: center
        margin-bottom: 4px
  - type: container
    layout: horizontal
    props:
      center_x: true
      gap: 4
    children:
      - type: h3
        props:
          text: No account?
          class: gray-text
      - type: a
        props:
          href: /auth_register
          text: Register
