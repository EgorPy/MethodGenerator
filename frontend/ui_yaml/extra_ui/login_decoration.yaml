type: container
props:
  position: form-top
  layout: vertical
  center_x: true
  gap: 8
children:
  - type: h1
    props:
      text: "Вход"
      style:
        text-align: center
        margin-bottom: 4px
  - type: container
    layout: horizontal
    props:
      center_x: true
      gap: 4
    children:
      - type: h3
        props:
          text: "Нет аккаунта?"
          class: gray-text
      - type: a
        props:
          href: "#"
          text: "Регистрация"
          style:
            text-decoration: underline
